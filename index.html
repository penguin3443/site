<!DOCTYPE html>
<html>
<p align="center">Welcome.</p>
<br>
<p align="center" id="demo">money made: 0.0₡</p>
<style>
body {
    background-image: url("https://files.catbox.moe/902ygk.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
</style>
<script type="text/javascript">
const moneyCounter = document.getElementById("demo");
let money=0;
let sum=0;
const FPS = 10;
const interval = 10;
setInterval(() => {
sum %= 1000;
sum += 1 / (1000 / interval) * FPS;
let step = Math.floor(sum);
money += Math.random() % 20;
let message = `money made: ${money.toFixed(2)}₡`;
let index = step % (message.length - money.toFixed(2).length);
message = message.slice(0, index) + message[index].toUpperCase() + message.slice(index + 1);
moneyCounter.innerHTML = message;
}, interval);
console.log(1+2);
</script>
</html>
